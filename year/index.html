  const long = (iso) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const root = document.documentElement;
  try { const t = localStorage.getItem('year-theme'); if (t) root.dataset.theme = t; } catch {}
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('theme').onclick = () => {
    root.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('year-theme', root.dataset.theme); } catch {}
    draw();
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!root.dataset.theme) draw(); });
  const palette = () => isDark()

      const p = Math.min(1, (now - t0) / dur);

  function rankOf(d) {
    const higher = days.filter((x) => x.n > d.n).length;
    return d.n ? (higher === 0 ? 'the busiest day of the year' : `busier than ${Math.round(100 * (days.length - higher - 1) / days.length)}% of days`) : 'a quiet day';
  }
  function note() {
    if (pinned) {
      $('note').innerHTML = `<b>${long(pinned.date)}</b>: ${fmt(pinned.n)} contribution${pinned.n === 1 ? '' : 's'}, ${rankOf(pinned)}. <a href="#" id="unpin">Clear</a>`;
      $('unpin').onclick = (e) => { e.preventDefault(); pinned = null; draw(); };
    } else if (month) {
      const ds = days.filter((d) => d.date.startsWith(month));
      const sum = ds.reduce((s, d) => s + d.n, 0), on = ds.filter((d) => d.n).length;
      const best = ds.reduce((a, d) => (d.n > a.n ? d : a), ds[0]);
      $('note').innerHTML = `<b>${MONTHS[+month.slice(5) - 1]} ${month.slice(0, 4)}</b>: ${fmt(sum)} contributions on ${on} days${best.n ? `, busiest ${short(best.date)} with ${best.n}` : ''}.`;
    } else {
      $('note').innerHTML = `Busiest day: <b>${short(data.busiest.date)}</b> with ${fmt(data.busiest.count)} contributions. Click any day to pin it.`;
    }
  }
  const inMonth = (d) => !month || d.date.startsWith(month);

  // ---- the city: one block per day, as tall as the day's contributions
  function city(rising) {
    const U = 19.2, V = [5.2, -6.6], BW = 15.4, BD = 0.78, X0 = 40, Y0 = 300, HMAX = 160, W = 1150, H = 330;
    const pal = palette(), max = Math.max(1, ...days.map((d) => d.n));
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'The year as a city, one block a day' });
    const order = [...days].sort((a, b) => b.wd - a.wd || a.wk - b.wk);
    const blocks = [];
    for (const d of order) {
      const ox = X0 + d.wk * U + d.wd * V[0], oy = Y0 + d.wd * V[1];
      const A = [ox, oy], B = [ox + BW, oy], C = [ox + BW + V[0] * BD, oy + V[1] * BD], D = [ox + V[0] * BD, oy + V[1] * BD];
      const h = d.n ? 5 + (HMAX - 5) * Math.log1p(d.n) / Math.log1p(max) : 0;
      const up = ([x, y]) => [x, y - h], P = (list) => list.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' ');
      const g = el('g', { class: 'blk', tabindex: '-1' }, svg);
      if (!d.n) el('polygon', { points: P([A, B, C, D]), fill: pal.flat }, g);
      else {
        const k = Math.log1p(d.n) / Math.log1p(max), c = mix(pal.lo, pal.hi, Math.min(1, k * k * 1.25));
        el('polygon', { points: P([A, B, up(B), up(A)]), fill: rgb(c, 0.78) }, g);
        el('polygon', { points: P([B, C, up(C), up(B)]), fill: rgb(c, 0.6) }, g);
        el('polygon', { points: P([up(A), up(B), up(C), up(D)]), fill: pinned === d ? 'var(--ink)' : rgb(c) }, g);
        if (h > 30) for (let wy = A[1] - h + 7; wy < A[1] - 6; wy += 7) for (const wx of [A[0] + 3.4, A[0] + 9.4]) {
          if (((d.wk * 7 + d.wd) * 31 + Math.round(wy) * 7 + Math.round(wx)) % 10 < 3) el('rect', { x: wx, y: wy, width: 2.6, height: 2.4, fill: pal.win, opacity: 0.6 }, g);
        }
      }
      if (!inMonth(d)) g.classList.add('dim');
      if (pinned === d) g.classList.add('on');
      g.addEventListener('mousemove', (e) => showTip(d, e));
      g.addEventListener('mouseleave', hideTip);
      g.addEventListener('click', () => { pinned = pinned === d ? null : d; draw(); });
      blocks.push([d, g]);
    }
    // months along the front
    days.filter((d) => d.date.endsWith('-01')).forEach((d) => {
      const t = el('text', { x: X0 + d.wk * U, y: Y0 + 22, class: 'mono', 'font-size': 12, fill: 'currentColor', opacity: 0.6 }, svg);
      t.textContent = MONTHS[+d.date.slice(5, 7) - 1];
    });
    $('stage').querySelector('svg')?.remove();
    $('stage').appendChild(svg);
    if (rising) replay(blocks.map(([d, g]) => [d, g]));
  }

  // ---- the grid: the familiar calendar, one square a day
  function grid() {
    const S = 17, G = 4, X0 = 44, Y0 = 26, W = X0 + 53 * (S + G) + 10, H = Y0 + 7 * (S + G) + 30;
    const pal = palette(), max = Math.max(1, ...days.map((d) => d.n));
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'The year as a calendar grid' });
    for (const d of days) {
      const k = d.n ? Math.log1p(d.n) / Math.log1p(max) : 0;
      const r = el('rect', { x: X0 + d.wk * (S + G), y: Y0 + d.wd * (S + G), width: S, height: S, rx: 4, class: 'cell', fill: d.n ? rgb(mix(pal.lo, pal.hi, Math.min(1, 0.15 + k))) : pal.flat }, svg);
      if (!inMonth(d)) r.classList.add('dim');
      if (pinned === d) r.setAttribute('stroke', 'var(--ink)'), r.setAttribute('stroke-width', 2);
      r.addEventListener('mousemove', (e) => showTip(d, e));
      r.addEventListener('mouseleave', hideTip);
      r.addEventListener('click', () => { pinned = pinned === d ? null : d; draw(); });
    }
    ['Mon', 'Wed', 'Fri'].forEach((w) => {
      const t = el('text', { x: 0, y: Y0 + WEEKDAYS.indexOf(w) * (S + G) + 13, class: 'mono', 'font-size': 11, fill: 'currentColor', opacity: 0.6 }, svg);
      t.textContent = w;
    });
    days.filter((d) => d.date.endsWith('-01')).forEach((d) => {
      const t = el('text', { x: X0 + d.wk * (S + G), y: 14, class: 'mono', 'font-size': 11, fill: 'currentColor', opacity: 0.6 }, svg);
      t.textContent = MONTHS[+d.date.slice(5, 7) - 1];
    });
    $('stage').querySelector('svg')?.remove();
    $('stage').appendChild(svg);
  }

  // ---- replay: the year builds itself again, week by week, with the date running
  let playing = 0;
  function replay(blocks) {
    if (reduce) return;
    const run = ++playing, weeks = Math.max(...days.map((d) => d.wk)) + 1, t0 = performance.now(), per = 70;
    blocks.forEach(([, g]) => g.classList.add('hidden'));
    $('replay').textContent = '■ Playing…';
    const step = (now) => {
      if (run !== playing) return;
      const wk = Math.floor((now - t0) / per);
      blocks.forEach(([d, g]) => { if (d.wk <= wk) g.classList.remove('hidden'); });
      const shown = days.filter((d) => d.wk <= wk);
      const last = shown[shown.length - 1];
      if (last) $('note').innerHTML = `<b>${short(last.date)}</b> · ${fmt(shown.reduce((s, d) => s + d.n, 0))} contributions so far`;
      if (wk < weeks) requestAnimationFrame(step);
      else { $('replay').textContent = '▶ Replay the year'; note(); }
    };
    requestAnimationFrame(step);
  }
  $('replay').onclick = () => { if (view !== 'city') setView('city'); pinned = null; month = null; monthsBar(); draw(true); };

  // ---- months to filter by, and the two small charts
  function monthsBar() {
    const keys = [...new Set(days.map((d) => d.date.slice(0, 7)))];
    $('months').innerHTML = `<button type="button" data-m="" aria-pressed="${!month}">All</button>`
      + keys.map((k, i) => `<button type="button" data-m="${k}" aria-pressed="${month === k}">${MONTHS[+k.slice(5) - 1]}${i === 0 || k.slice(5) === '01' ? ` ’${k.slice(2, 4)}` : ''}</button>`).join('');
    $('months').querySelectorAll('button').forEach((b) => (b.onclick = () => { month = b.dataset.m || null; pinned = null; monthsBar(); draw(); }));
  }
  function bars(id, rows) {
    const max = Math.max(1, ...rows.map((r) => r[1]));
    $(id).innerHTML = rows.map(([l, v, title]) => `<div title="${title}"><i style="height:0"></i><small>${l}</small></div>`).join('');
    requestAnimationFrame(() => $(id).querySelectorAll('i').forEach((i, j) => (i.style.height = `${Math.max(2, 100 * rows[j][1] / max) * 0.82}%`)));
  }
  function charts() {
    const wd = WEEKDAYS.map((w, i) => { const v = days.filter((d) => d.wd === i).reduce((s, d) => s + d.n, 0); return [w, v, `${w}: ${fmt(v)} contributions`]; });
    bars('weekdays', wd);
    const keys = [...new Set(days.map((d) => d.date.slice(0, 7)))];
    bars('monthbars', keys.map((k) => { const v = days.filter((d) => d.date.startsWith(k)).reduce((s, d) => s + d.n, 0); const m = MONTHS[+k.slice(5) - 1]; return [m, v, `${m} ${k.slice(0, 4)}: ${fmt(v)} contributions`]; }));
  }

  function setView(v) {
    view = v;
    document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === v));
    draw();
  }
  document.querySelectorAll('[data-view]').forEach((b) => (b.onclick = () => setView(b.dataset.view)));
  function draw(rising = false) { hideTip(); (view === 'city' ? city(rising) : grid()); note(); }

  // ---- data: today's file from the profile repo, or the copy baked into this page
  function start(json) {
    data = json;
    const first = new Date(json.days[0][0] + 'T00:00:00Z');
    days = json.days.map(([date, n]) => {
      const dt = new Date(date + 'T00:00:00Z');
      return { date, n, wd: dt.getUTCDay(), wk: Math.floor((dt - first) / 864e5 + first.getUTCDay()) / 7 | 0 };
    });
    tiles(); monthsBar(); charts(); draw(true);
  }
  const snapshot = JSON.parse($('snapshot').textContent);
  fetch(DATA_URL, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : Promise.reject(r.status))).then(start).catch(() => start(snapshot));
})();
</script>
</body>
</html>
